name: Java CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    
    - name: Run tests
      run: mvn -B test --file pom.xml
        
    - name: Run KnapsackExample and capture output
      run: |
        mvn exec:java -Dexec.mainClass="de.nilsbeck.knapsack_example.KnapsackExample" | tee knapsack_output.txt

    - name: Check KnapsackExample output for expected result
      run: |
        grep "Iteration: 10, Best value: 7534.0" knapsack_output.txt 
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: target/surefire-reports/
        if-no-files-found: error
